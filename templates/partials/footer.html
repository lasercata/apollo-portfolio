<footer>
  <div>
    {% if config.extra.copyright %}
      {{ now() | date(format="%Y") }} ©
      <i>{{ config.extra.copyright or "" }}</i>
    {% endif %}
  </div>

  {# &mdash; #}
  {# &middot; #}
  &bull;

  {% if config.extra.repo_url %}
    <div>
      <a href="{{ config.extra.repo_url }}" class="source-code">
        {# <img alt="source code" src="{{ get_url(path='icons/code.svg') }}" /> #}
        source
      </a>
    </div>

    &bull;
  {% endif %}

  {% if config.extra.status_page_link %}
    <div class="socials">
      <a href="{{ config.extra.status_page_link }}" class="social">
        <img alt="status" src="{{ get_url(path='icons/status.svg') }}" />
      </a>
    </div>

    &bull;
  {% endif %}

  {% include "partials/socials.html" %}
</footer>
