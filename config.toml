base_url = "https://not-matthias.github.io/apollo/"
description = "This is an example description"

build_search_index = false
compile_sass = true
minify_html = true

default_language = "en"

# To add a language, add a line here first.
# This is needed for zola to generate files at /it (for example).
# Then create the menu in [extra.xx].
# Then translate **all** your content (e.g _index.md -> _index.xx.md).
# Comment all lines to disable other languages
[languages.it.translations]
# [languages.fr.translations]

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
error_on_missing_language = true

[extra]
# Title defined here in order to be available in all languages
title = "apollo-portfolio"

toc = true
# favicon = "/icon/favicon.png"
theme = "toggle"              # light, dark, auto, toggle, toggle-auto
fancy_code = true
dynamic_note = true           # a note that can be toggled
mathjax = false
repo_url = "https://github.com/lasercata/apollo-portfolio/"

fediverse = false    # author attribution
fediverse_creator = ""    # e.g. @user@instance

socials = [
    { name = "github", url = "https://github.com/", icon = "github" },
    { name = "email", url = "mailto:mail@example.com", icon = "email" },
]


copyright = "Your name"
source_code = "https://github.com/lasercata/apollo-portfolio"

stylesheets = [
    # "custom.css"    # at /static/custom.css
]

[extra.analytics]
enabled = false

[extra.analytics.goatcounter]
user = "your_user"
host = "example.com" # default= goatcounter.com

[extra.analytics.umami]
website_id = "43929cd1-1e83...."
host_url = "https://stats.mywebsite.com" # default: https://api-gateway.umami.dev/

[extra.en]
menu = [
    { name = "Projects", url = "/projects", weight = 1 },
    { name = "About", url = "/about", weight = 2 },
    { name = "Contact", url = "/contact", weight = 3 },
]

[extra.it]
menu = [
    { name = "Progetti", url = "/it/projects", weight = 1 },
    { name = "Informazioni", url = "/it/about", weight = 2 },
    { name = "Conttato", url = "/it/contact", weight = 3 },
]

